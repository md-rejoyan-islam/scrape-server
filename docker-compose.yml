services:
  scraper:
    build: .
    image: scraping-server
    container_name: scraper-bot
    environment:
      - PORT=8090
      # Add your proxy URL here to bypass Cloudflare rate-limits on high-volume scraping!
      # Format: http://username:password@ip:port
      # - PROXY_URL=http://user:pass@proxy-server:8080
    restart: unless-stopped
    shm_size: "2gb" # Increased shared memory size to prevent Chrome crashes in Docker
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scraper.rule=Host(`scrape-server.rejoyan.me`)"
      - "traefik.http.routers.scraper.entrypoints=websecure"
      - "traefik.http.routers.scraper.tls.certresolver=letsencrypt"
      - "traefik.http.services.scraper.loadbalancer.server.port=8090"

networks:
  dokploy-network:
    external: true
